# Shared LoRA settings for the Klee distillation runs (mlx-lm).
fine_tune_type: lora
train: true
mask_prompt: true          # learn the program, not the prompt
num_layers: -1             # adapt every layer
batch_size: 4
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 50
  arguments: [1.0e-4, 1200, 1.0e-6]
max_seq_length: 1800
grad_checkpoint: true
steps_per_report: 20
steps_per_eval: 200
val_batches: 25
save_every: 400
seed: 7
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
